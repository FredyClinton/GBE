# Configuration commune à tous les profils.
# Les valeurs spécifiques sont dans application-dev.yaml / application-prod.yaml.
spring:
  application:
    name: gbe
  profiles:
    active: dev            # surchargé par la variable d'environnement SPRING_PROFILES_ACTIVE
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Le schéma est géré par Flyway (src/main/resources/db/migration) ;
      # Hibernate vérifie seulement que les entités correspondent aux tables.
      ddl-auto: validate
    database: postgresql
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Bases déjà créées par l'ancien ddl-auto=update : elles sont marquées en V2
    # (schéma + référentiel présents) et seule V3 (idempotente) leur est appliquée.
    baseline-on-migrate: true
    baseline-version: 2

app:
  security:
    jwt:
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:8640000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
      mfa-token-expiration: 300000
